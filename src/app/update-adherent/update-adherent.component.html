<div class="container">
  <div class="card shadow">
    <div class="card-body">
      <h2>Modifier un adhérent :</h2>
      <form (ngSubmit)="updateAdherent()">
        <div class="mb-3">
          <label class="form-label">Id Adhérent</label>
          <input type="text" class="form-control" name="idAdherent"
                 [(ngModel)]="currentAdherent.idAdherent" readonly>
        </div>
        <div class="mb-3">
          <label class="form-label">Nom</label>
          <input type="text" class="form-control" name="nom"
                 [(ngModel)]="currentAdherent.nom">
        </div>
        <div class="mb-3">
          <label class="form-label">Prénom</label>
          <input type="text" class="form-control" name="prenom"
                 [(ngModel)]="currentAdherent.prenom">
        </div>
        <div class="mb-3">
          <label class="form-label">Type d'abonnement</label>
          <select class="form-select" name="idType" [(ngModel)]="updatedIdType">
            @for (t of types; track t.idType) {
              <option [ngValue]="t.idType">{{ t.nomType }}</option>
            }
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Prix Abonnement</label>
          <input type="number" class="form-control" name="prixAbonnement"
                 [(ngModel)]="currentAdherent.prixAbonnement">
        </div>
        <div class="mb-3">
          <label class="form-label">Date inscription</label>
          <input type="date" class="form-control" name="dateInscription"
                 [ngModel]="currentAdherent.dateInscription | date:'yyyy-MM-dd'"
                 (ngModelChange)="currentAdherent.dateInscription = $event">
        </div>
        <button type="submit" class="btn btn-primary">Modifier</button>
      </form>
    </div>
  </div>
</div>
